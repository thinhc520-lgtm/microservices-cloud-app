version: "3.8"

networks:
  app-network:
    driver: bridge

volumes:
  db_user_data:
  db_product_data:
  db_order_data:

services:
  # CỔNG VÀO CHÍNH (API GATEWAY)
  api-gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - user-service
      - product-service
      - order-service
    networks:
      - app-network

  # FRONTEND
  frontend:
    build:
      context: ./frontend
    container_name: web_frontend
    networks:
      - app-network

  # USER SERVICE & DB
  user-service:
    build:
      context: ./user-service
    container_name: app_user_service
    depends_on:
      - user-db
    networks:
      - app-network

  user-db:
    image: mysql:8.0
    container_name: db_user_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    volumes:
      - db_user_data:/var/lib/mysql
    networks:
      - app-network

  # PRODUCT SERVICE & DB
  product-service:
    build:
      context: ./product-service
    container_name: app_product_service
    depends_on:
      - product-db
    networks:
      - app-network

  product-db:
    image: mysql:8.0
    container_name: db_product_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    volumes:
      - db_product_data:/var/lib/mysql
    networks:
      - app-network

  # ORDER SERVICE & DB
  order-service:
    build:
      context: ./order-service
    container_name: app_order_service
    depends_on:
      - order-db
    networks:
      - app-network

  order-db:
    image: mysql:8.0
    container_name: db_order_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    volumes:
      - db_order_data:/var/lib/mysql
    networks:
      - app-network
