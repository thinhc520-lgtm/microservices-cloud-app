events { 
    worker_connections 1024; 
}

http {
    server {
        listen 80;

        # 1. Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. User Service
        location /api/users {
            proxy_pass http://user-service:80/index.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Product Service
        location /api/products {
            proxy_pass http://product-service:80/index.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Order Service
        location /api/orders {
            proxy_pass http://order-service:80/index.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}