events { 
    worker_connections 1024; 
}

http {
    upstream product_backend {
        server product-service:3002;
    }

    server {
        listen 80;

        # 1. Định tuyến Giao diện người dùng
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Định tuyến User Service
        location /api/users/ {
            proxy_pass http://user-service:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Định tuyến Product Service (hỗ trợ scale và load balancing)
        location /api/products {
            proxy_pass http://product_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Định tuyến Order Service
        location /api/orders {
            proxy_pass http://order-service:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}